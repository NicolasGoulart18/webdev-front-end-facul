<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Formulários em HTML</title>
</head>
<body>
    <form method="post">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" size="30">
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" size="30">
        <br><br>

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" size="30">
        <br><br>

        <label for="dataDeNascimento">Nascimento:</label>
        <input type="date" id="dataDeNascimento" name="nascimento">
        <br><br>

        <label for="horas">Horário para contato:</label>
        <input type="time" id="horas" name="horas">
        <br><br>

        <label for="dataHorario">Data e horário:</label>
        <input type="datetime-local" id="dataHorario" name="dataHorario">
        <br><br>

        <button type="submit">Cadastrar</button>
        <button type="reset">Limpar</button>
    </form>
</body>
</html>
