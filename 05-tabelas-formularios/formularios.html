<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Formulários em HTML</title>
</head>
<body>
    <form method="post">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="Nome" size="30">
        <br><br>
        <label for="email">Email:</label>
        <input type="text" id="email" name="Email" size="30">
        <br><br>
        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="Senha" size="30">
        <br><br>
        <label for="dataDeNascimento">Nascimento:</label>
        <input type="date" id="dataDeNascimento " name="Nascimento">
        <br><br>
        <label for="horas">Horario Para Contato:</label>
        <input type="time" name="horas" id="Horario Para Contato">
        <br><br>
        <button type="submit">Cadastrar</button>
        <button type="reset">Limpar</button>
    </form>    
</body>
</html>
