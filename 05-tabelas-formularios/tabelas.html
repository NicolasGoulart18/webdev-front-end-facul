<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Tabelas em HTML</title>
</head>
<body>
   <!--<table> = tabela inteira
        <tr> = linha
        <th> = célula do cabeçalho
        <td>= célula de dados       -->
    <table>
        <tr>
            <th>Produtos</th>
            <th>Preços</th>  
        </tr>
        
        <tr>
            <td>Notebook</td>
            <td>R$ 3500</td>
        </tr>

        <tr>
            <td>Mouse</td>
            <td>R$ 100</td>
        </tr>

    </table>
</body>
</html>
