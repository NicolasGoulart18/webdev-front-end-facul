<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Imagens em HTML</title>
</head>
<body>
    <h1>Imagens em HTML</h1>

    <!-- src informa o caminho da imagem e alt fornece texto alternativo -->
    <img src="foto.jpg" alt="Foto do aluno">

    <!-- width e height definem as dimensões da imagem -->
    <img
        src="logo.png"
        alt="Logotipo da empresa"
        width="300"
        height="200">

    <p>
        O atributo alt é importante para acessibilidade e fornece uma descrição textual da imagem.
    </p>
</body>
</html>
