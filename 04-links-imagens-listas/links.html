<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Links em HTML</title>
</head>
<body>
    <h1>Links em HTML</h1>

    <!-- href define o destino do link -->
    <p>
        <a href="https://www.google.com">Abrir Google</a>
    </p>

    <!-- target="_blank" abre o destino em uma nova aba/janela -->
    <p>
        <a href="https://www.exemplo.com" target="_blank" title="Visite o site">
            Visite o site de exemplo
        </a>
    </p>

    <!-- Uma imagem também pode ficar dentro de um link -->
    <a href="site.html">
        <img src="logo.png" alt="Logo do site" width="150" height="50">
    </a>
</body>
</html>
