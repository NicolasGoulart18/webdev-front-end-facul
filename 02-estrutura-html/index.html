<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Estrutura HTML</title>
</head>
<body>
    <!-- Exemplo prático do Bloco 2 -->
    <h1>Estrutura básica do HTML</h1>
    <p>Este conteúdo está dentro do body e aparece para o usuário.</p>

    <!-- Tag com atributo -->
    <a href="https://google.com">Google</a>

    <!-- Elementos sem fechamento separado -->
    <br>
    <img src="foto.jpg" alt="Minha foto">
    <input type="text">

    <!-- Aninhamento correto -->
    <p>
        Texto com uma <strong>parte importante</strong> dentro do parágrafo.
    </p>

    <!--
        Exemplos equivalentes usando a sintaxe mais rígida do XHTML:
        <br />
        <img src="foto.jpg" alt="Minha foto" />
        <input type="checkbox" checked="checked" />
    -->
</body>
</html>
