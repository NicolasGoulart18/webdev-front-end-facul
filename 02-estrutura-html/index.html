<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Estrutura HTML</title>
</head>
<body>
    <!-- Exemplo prático da estrutura básica estudada no Bloco 2 -->
    <h1>Estrutura básica do HTML</h1>
    <p>Este conteúdo está dentro do body e aparece para o usuário.</p>

    <!-- Exemplo de tag com atributo -->
    <a href="https://google.com">Google</a>

    <!-- Elementos vazios estudados -->
    <br>
    <img src="foto.jpg" alt="Minha foto">
    <input type="text">

    <!-- Exemplo de aninhamento correto -->
    <p>
        Texto com uma <strong>parte importante</strong> dentro do parágrafo.
    </p>

    <!-- Exemplos de sintaxe XHTML estudada:
         <br />
         <img src="foto.jpg" alt="Minha foto" />
         <input type="checkbox" checked="checked" />
    -->
</body>
</html>
